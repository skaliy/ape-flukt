<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ape-Flukt! - Rømm fra Trollet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 100%;
            max-width: 1100px;
            max-height: 100vh;
            padding: 10px;
        }

        #gameCanvas {
            border: 4px solid #4a4a6a;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(100, 100, 255, 0.3);
            cursor: crosshair;
            max-width: 100%;
            max-height: calc(100vh - 80px);
            touch-action: none;
        }

        .game-info {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            padding: 5px;
        }

        /* Mobile optimization - fill screen */
        @media (max-width: 768px) {
            .game-info {
                display: none;
            }

            #gameContainer {
                padding: 2px;
                gap: 0;
                max-width: 100%;
                justify-content: center;
            }

            #gameCanvas {
                border-width: 2px;
                border-radius: 6px;
                max-width: 100%;
                max-height: calc(100vh - 4px);
                width: auto;
                height: auto;
            }
        }

        /* Landscape mobile optimization */
        @media (max-height: 500px) {
            #gameContainer {
                padding: 0;
            }

            #gameCanvas {
                border-width: 1px;
                border-radius: 4px;
                max-height: 100vh;
            }

            .game-info {
                display: none;
            }
        }

        /* Extra small screens */
        @media (max-width: 400px) {
            #gameContainer {
                padding: 0;
            }

            #gameCanvas {
                border-width: 1px;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <p class="game-info">Mus = Følg peker | Piltaster/WASD = Beveg | Klikk/SHIFT = Sprint | SPACE = Start</p>
        <!-- Hidden input for mobile name entry -->
        <input type="text" id="mobileNameInput" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
